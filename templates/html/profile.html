<!DOCTYPE html>
<html lang="nl-BE">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameForge - Profiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css'>
</head>

<body class="text-white min-h-screen flex flex-col bg-[#001B29]">

    <header class="bg-[#003652] py-4">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">GameForge</h1>
            <a href="index.html" class="text-green-400 hover:text-green-300">Uitloggen</a>
        </div>
    </header>

    <main class="flex-1 flex justify-center items-center py-10">
        <div class="bg-[#003652] p-8 rounded-xl w-full max-w-md text-center shadow-lg">

            <img src="../../assets/img/profile.jpg" alt="Profielfoto"
                class="w-32 h-32 rounded-full mx-auto mb-4 object-cover border-4 border-green-500">

            <h2 class="text-2xl font-bold mb-2">J4SP3R</h2>

            <div class="bg-white/10 p-4 rounded-lg mb-4">
                <p class="text-sm text-gray-300">
                    Hallo, ik ben J4SP3R en ik speel graag EA FC 26, Minecraft en NHL 26.
                </p>
            </div>

            <button class="w-full bg-green-500 hover:bg-green-400 py-2 rounded-md font-semibold">
                Profiel bewerken
            </button>
        </div>
    </main>

    <footer class="bg-[#003652] py-6 text-center">
        <span>© 2026 GameForge</span>
    </footer>

</body>

</html>
