<!DOCTYPE html>
<html lang="nl-BE">
<head>
  <meta charset="UTF-8">
  <title>Guess the game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0&icon_names=person" />
</head>
<body class="text-white min-h-screen flex flex-col">
<header class="sticky w-full bg-[#003652]">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center relative">
    <!-- Logo -->
    <a class="flex items-center" href="homepage.html">
      <img alt="Gameforge logo" class="h-16 w-auto" src="/assets/img/logo.png">
    </a>
    <a class="font-bold hover:underline uppercase" href="guessthegame.html">Guess the game</a>

    <!-- Searchbox -->
    <div class="absolute left-1/2 transform -translate-x-1/2 w-full max-w-md">
      <input class="w-full px-4 py-2 rounded-lg border outline-none focus:ring-2 text-black" placeholder="Search games..." type="search">
    </div>

    <!-- Navbar Buttons -->
    <nav class="ml-auto flex items-center gap-6">
      <a class="font-medium hover:underline" href="homepage.html">Home</a>
      <a class="font-medium hover:underline" href="collections.html">Collections</a>
      <a class="font-medium hover:underline" href="profile.html">
        <span class="material-symbols-outlined">
          person
        </span>
      </a>
    </nav>
  </div>
</header>
<main class="bg-[#001B29] flex-1">

  <div class="flex flex-col items-center justify-center h-full py-10 gap-6">

    <!-- Attempt Counter -->
    <div id="attempts" class="text-xl font-bold">
      Attempt 1/5
    </div>

    <!-- Image -->
    <div class="w-96 h-56 overflow-hidden rounded-xl border-4 border-white">
      <img id="gameImage"
           src="../assets/img/guess.png"
           class="w-full h-full object-cover blur-[20px] transition-all duration-500">
    </div>

    <!-- Input -->
    <div class="flex gap-2">
      <input id="guessInput"
             type="text"
             placeholder="Guess the game..."
             class="px-4 py-2 rounded-lg text-black outline-none">

      <button onclick="submitGuess()"
              class="bg-blue-500 px-4 py-2 rounded-lg hover:bg-blue-600">
        Guess
      </button>
    </div>

    <!-- Feedback -->
    <div id="feedback" class="text-lg font-medium"></div>

  </div>

  <script src="../js/guess.js"></script>
</main>
<footer class="bg-[#003652] py-6">
  <div class="flex flex-col items-center">
    <span class="text-[11px]">© 2026 GameForge</span>
    <span class="text-[11px]">All rights reserved</span>

    <!-- Terms of service RAWG API -->
    <a href="https://rawg.io" target="_blank" class="font-medium hover:underline text-[11px]">
      source of data used is RAWG API
    </a>
  </div>
</footer>
</body>
</html>
