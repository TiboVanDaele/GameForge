<!DOCTYPE html>
<html lang="nl-BE">
<head>
    <meta charset="UTF-8">
    <title>Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="text-white min-h-screen flex flex-col">
<header class="sticky w-full bg-[#003652]">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center relative">
        <!-- Logo -->
        <a class="flex items-center" href="index.html">
            <img alt="Gameforge logo" class="h-16 w-auto" src="/assets/img/logo.png">
        </a>

        <!-- Searchbox -->
        <div class="absolute left-1/2 transform -translate-x-1/2 w-full max-w-md">
            <input class="w-full px-4 py-2 rounded-lg border outline-none focus:ring-2" placeholder="Search games..." type="search">
        </div>

        <!-- Navbar Buttons -->
        <nav class="ml-auto flex items-center gap-6">
            <a class="font-medium hover:underline" href="index.html">Home</a>
            <a class="font-medium hover:underline" href="#">Collections</a>
            <a class="font-medium hover:underline" href="#">Account</a>
        </nav>
    </div>
</header>

    <main class="flex-1 flex justify-center items-center py-10 bg-[var(--bg-main)]">
        <div class="p-8 rounded-xl w-full max-w-md text-center shadow-lg">

            <img src="../assets/img/profile.jpg" alt="Profielfoto"
                 class="w-32 h-32 rounded-full mx-auto mb-4 object-cover border-4 border-green-500">

            <h2 class="text-2xl font-bold mb-2">J4SP3R</h2>

            <div class="bg-white/10 p-4 rounded-lg mb-4">
                <p class="text-sm text-gray-300">
                    Hallo, ik ben J4SP3R en ik speel graag EA FC 26, Minecraft en NHL 26.
                </p>
            </div>

            <button class="w-full bg-green-500 hover:bg-green-400 py-2 rounded-md font-semibold">
                Profiel bewerken
            </button>
        </div>
    </main>

<footer class="bg-[#003652] py-6">
    <div class="flex flex-col items-center">
        <span class="text-[8px]">© 2026 GameForge</span>
        <span class="text-[8px]">All rights reserved</span>
    </div>
</footer>
</body>
</html>
