<!DOCTYPE html>
<html lang="nl-BE">
<head>
  <meta charset="UTF-8">
  <title>Mijn Games</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0&icon_names=person" />
</head>
<body class="text-white min-h-screen flex flex-col">
<header class="sticky w-full bg-[#003652]">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center relative">
    <!-- Logo -->
    <a class="flex items-center" href="homepage.html">
      <img alt="Gameforge logo" class="h-16 w-auto" src="/assets/img/logo.png">
    </a>

    <!-- Searchbox -->
    <div class="absolute left-1/2 transform -translate-x-1/2 w-full max-w-md">
      <input class="w-full px-4 py-2 rounded-lg border outline-none focus:ring-2" placeholder="Search games..." type="search">
    </div>

    <!-- Navbar Buttons -->
    <nav class="ml-auto flex items-center gap-6">
      <a class="font-medium hover:underline" href="homepage.html">Home</a>
      <a class="font-medium hover:underline" href="collections.html">Collections</a>
      <a class="font-medium hover:underline" href="profile.html">
        <span class="material-symbols-outlined">
          person
        </span>
      </a>
    </nav>
  </div>
</header>
<main class="bg-[#001B29] flex-1">
<h1 class="text-xl mt-5 ml-5 font-bold">Mijn Games</h1>
  <div id="games-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 m-2">
    <!-- example card  -->
    <a href="#" class="m-2">
      <div class="bg-[var(--bg-card)] rounded-xl overflow-hidden">
        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/b/b6/Minecraft_2024_cover_art.png/250px-Minecraft_2024_cover_art.png" alt="Game 1" class="w-full h-auto object-cover">
        <div class="p-2 text-center font-medium">
          Game 1
        </div>
      </div>
    </a>
  </div>

</main>
<footer class="bg-[#003652] py-6">
  <div class="flex flex-col items-center">
    <span class="text-[8px]">© 2026 GameForge</span>
    <span class="text-[8px]">All rights reserved</span>

    <!-- Terms of service RAWG API -->
    <a href="https://rawg.io" target="_blank" class="font-medium hover:underline text-[8px]">
      source of data used is RAWG API
    </a>
  </div>
</footer>
</body>
</html>
