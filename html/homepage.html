<!DOCTYPE html>
<html lang="nl-BE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-white min-h-screen flex flex-col">
<header class="sticky top-0 w-full bg-[#003D5C]">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center relative gap-3">
        <!-- Logo -->
        <a class="flex items-center" href="homepage.html">
            <img alt="Gameforge logo" class="h-8 md:h-16 w-auto" src="/assets/img/logo.png">
        </a>

        <!-- Searchbox -->
        <div class="flex-1 md:absolute md:left-1/2 md:-translate-x-1/2 w-full md:w-full md:max-w-md flex justify-center mt-0">
            <label class="w-full flex justify-center">
                <input id="game-searchbox"
                       class="w-full md:w-2/3 lg:w-full px-4 py-2 rounded-lg border focus:ring-2"
                       placeholder="Search games..."
                       type="search">
            </label>
        </div>

        <!-- Navbar Buttons -->
        <nav class="flex items-center gap-4 md:gap-6 ml-auto md:ml-auto shrink-0">
            <a class="font-medium hover:underline" href="homepage.html">Home</a>
            <a class="font-medium hover:underline" href="collections.html">Collections</a>
            <a class="font-medium hover:underline" href="account.html">Account</a>
        </nav>
    </div>
</header>
<main class="bg-[#001B29] flex-1">
    <div id="games-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 m-2">
        <!-- example card  -->
        <a href="#" class="m-2">
            <div class="bg-[#003D5C] rounded-xl overflow-hidden">
                <img src="https://upload.wikimedia.org/wikipedia/en/thumb/b/b6/Minecraft_2024_cover_art.png/250px-Minecraft_2024_cover_art.png" alt="Game 1" class="w-full h-auto object-cover">
                <div class="p-2 text-center font-medium">
                    Game 1
                </div>
            </div>
        </a>
    </div>
</main>
<footer class="bg-[#003D5C] py-6">
    <div class="flex flex-col items-center">
        <span>© 2026 GameForge</span>
        <span>All rights reserved</span>

        <!-- Terms of service RAWG API -->
        <a href="https://rawg.io" target="_blank" class="font-medium hover:underline">
            source of data used is RAWG API
        </a>
    </div>
</footer>
</body>
</html>
