<!DOCTYPE html>
<html lang="nl-BE">
<head>
    <meta charset="UTF-8">
    <title>Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-white min-h-screen flex flex-col">
<header class="sticky top-0 w-full bg-[#003652]">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center relative">
        <!-- Logo -->
        <a class="flex items-center" href="index.html">
            <img alt="Gameforge logo" class="h-16 w-auto" src="/assets/img/logo.png">
        </a>

        <!-- Searchbox -->
        <div class="absolute left-1/2 transform -translate-x-1/2 w-full max-w-md">
            <input class="w-full px-4 py-2 rounded-lg border outline-none focus:ring-2" placeholder="Search games..." type="search">
        </div>

        <!-- Navbar Buttons -->
        <nav class="ml-auto flex items-center gap-6">
            <a class="font-medium hover:underline" href="index.html">Home</a>
            <a class="font-medium hover:underline" href="#">Collections</a>
            <a class="font-medium hover:underline" href="#">Account</a>
        </nav>
    </div>
</header>
<main class="bg-[#001B29] flex-1">
    <div id="games-container" class="flex flex-wrap justify-center gap-4 lg:gap-6 mt-3 mb-3">
        <!-- example card  -->
        <a href="#" class="w-1/3 lg:w-1/6 block">
            <div class="bg-[#002233] rounded-xl overflow-hidden">
                <img src="https://upload.wikimedia.org/wikipedia/en/thumb/b/b6/Minecraft_2024_cover_art.png/250px-Minecraft_2024_cover_art.png" alt="Game 1" class="w-full h-auto object-cover">
                <div class="p-2 text-center font-medium">
                    Game 1
                </div>
            </div>
        </a>
    </div>

</main>
<footer class="bg-[#003652] py-6">
    <div class="flex flex-col items-center">
        <span>© 2026 GameForge</span>
        <span>All rights reserved</span>

        <!-- Terms of service RAWG API -->
        <a href="https://rawg.io" target="_blank" class="font-medium hover:underline">
            source of data used is RAWG API
        </a>
    </div>
</footer>
</body>
</html>
