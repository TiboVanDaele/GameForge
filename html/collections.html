<!DOCTYPE html>
<html lang="nl-BE">
<head>

    <link rel="stylesheet" href="/css/style.css">

</head>
<body class="text-white min-h-screen flex flex-col">
<header class="sticky w-full bg-[#003652]">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center relative">
        <!-- Logo -->
        <a class="flex items-center" href="homepage.html">
            <img alt="Gameforge logo" class="h-16 w-auto" src="/assets/img/logo.png">
        </a>

        <!-- Searchbox -->
        <div class="absolute left-1/2 transform -translate-x-1/2 w-full max-w-md">
            <input class="w-full px-4 py-2 rounded-lg border outline-none focus:ring-2 text-black" placeholder="Zoek een game" type="search">
        </div>

        <!-- Navbar Buttons -->
        <nav class="ml-auto flex items-center gap-6">
            <a class="font-extralight hover:underline uppercase" href="homepage.html">home</a>
            <a class="font-medium hover:underline uppercase" href="collections.html">Collections</a>
            <a class="font-extralight hover:underline" href="profile.html">
        <span class="material-symbols-outlined align-bottom">
          person
        </span>
            </a>

</header>
<main class="bg-[#001B29] flex-1">

        <a href="myGames.html" class="m-2">
            <div class="bg-[var(--bg-card)] rounded-xl overflow-hidden">

                </div>
            </div>
        </a>

        <a href="wishlist.html" class="m-2">
            <div class="bg-[var(--bg-card)] rounded-xl overflow-hidden">

            </div>

</main>
<footer class="bg-[#003652] py-3">
    <div class="flex flex-col items-center">
        <span class="text-[10px]">© 2026 GameForge All rights reserved</span>
